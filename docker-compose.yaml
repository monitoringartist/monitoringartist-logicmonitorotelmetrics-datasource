services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      # Grafana 13 enables splashScreen by default; the overlay blocks Playwright interactions.
      GF_FEATURE_TOGGLES_splashScreen: 'false'
      # Override the base value now that the plugin ID is 'monitoringartist-logicmonitorotelmetrics-datasource'.
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: monitoringartist-logicmonitorotelmetrics-datasource
      # Enable localization for plugins.
      GF_FEATURE_TOGGLES_localizationForPlugins: 'true'
      GF_LOG_LEVEL: warn
      # production for e2e tests
      NODE_ENV: production
      GF_DEFAULT_APP_MODE: production
    configs:
      - source: grafana_custom_ini
        target: /etc/grafana/grafana.ini

configs:
  grafana_custom_ini:
    content: |
      [log]
      filters = plugin.monitoringartist-logicmonitorotelmetrics-datasource:debug
