services:
  lm-mock:
    image: golang:1.27.4
    working_dir: /src
    command: go run ./tests/lm-mock
    network_mode: 'service:grafana'
    depends_on:
      - grafana
    environment:
      HTTP_ADDR: ':8080'
      TLS_ADDR: ':8443'
    volumes:
      - .:/src:ro
      - lm_mock_gomod:/go/pkg/mod

  grafana:
    ports:
      - '8080:8080'
      - '8443:8443'

configs:
  grafana_custom_ini:
    content: |
      [plugin.monitoringartist-logicmonitorotelmetrics-datasource]
      lm_mock_base_url = https://localhost:8443
      [log]
      filters = plugin.monitoringartist-logicmonitorotelmetrics-datasource:debug

volumes:
  lm_mock_gomod:
