name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and draft release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read toolchain versions
        id: versions
        run: |
          echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          echo "go=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"
      # Builds, signs and packages the plugin, then creates a draft GitHub release with the zip.
      # GRAFANA_ACCESS_POLICY_TOKEN is a Grafana Cloud access policy token with the
      # plugins:write scope, created at https://grafana.com/orgs/<org>/access-policies
      # and stored as a repository secret. It is used to sign the plugin.
      - uses: grafana/plugin-actions/build-plugin@2f27a3fa1821583cb64627495d927773646c728f # build-plugin/v2.0.1
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          node-version: ${{ steps.versions.outputs.node }}
          go-version: ${{ steps.versions.outputs.go }}
          attestation: true
